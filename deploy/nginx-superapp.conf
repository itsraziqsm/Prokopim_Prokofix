# Reverse proxy nginx untuk Super App Prokopim. Pasang:
#   sudo cp deploy/nginx-superapp.conf /etc/nginx/sites-available/superapp
#   (ganti server_name di bawah dengan nama domain / alamat IP server)
#   sudo ln -s /etc/nginx/sites-available/superapp /etc/nginx/sites-enabled/superapp
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d DOMAIN  (certbot menambah blok 443 + pengalihan http -> https di berkas ini)

upstream superapp {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name superapp.contoh.go.id;

    server_tokens off;

    # Batas unggahan terbesar di aplikasi: foto Arsip Liputan 260 MB per kiriman, Gabungkan PDF 205 MB.
    # Aplikasi tetap memeriksa batas per fitur sendiri; nilai ini hanya pintu terluar.
    client_max_body_size 270m;
    client_body_timeout 300s;

    # Ekspor Word/PDF, gabung PDF, dan cadangan bisa memakan waktu
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Header keamanan (berlaku untuk semua respons)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Aplikasi tidak memuat apa pun dari luar (tanpa CDN). 'unsafe-inline' dibutuhkan skrip tema kecil di <head>
    # dan atribut style (lebar bilah progres). blob: dipakai pratinjau foto sebelum diunggah.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Setelah HTTPS stabil, aktifkan HSTS (hapus tanda # di bawah):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://superapp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
