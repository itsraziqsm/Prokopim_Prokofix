<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Arsip Berita & SPT{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <strong>Arsip Berita &amp; SPT</strong>
  <nav>
    {% for ep, label in menu %}
    <a href="{{ url_for(ep) }}" class="{{ 'aktif' if request.endpoint == ep }}">{{ label }}</a>
    {% endfor %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
