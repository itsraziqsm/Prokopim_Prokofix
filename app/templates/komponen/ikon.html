{#- Kumpulan ikon SVG inline. Pemakaian: {{ ikon("kamera") }}
    Warna mengikuti teks (currentColor), jadi otomatis cocok dengan tema. -#}
{% macro ikon(nama, kelas="") -%}
<svg class="ikon {{ kelas }}" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if nama == "dokumen-pecah" %}
  <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>
  <path d="M8 13h8" stroke-dasharray="2 2"/><path d="M9 17h6"/><path d="M9 9.5h2"/>
{%- elif nama == "kamera" %}
  <path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
  <circle cx="12" cy="13" r="3.5"/>
{%- elif nama == "panah-kiri" %}
  <path d="M19 12H5M11 18l-6-6 6-6"/>
{%- elif nama == "centang" %}
  <path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif nama == "matahari" %}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif nama == "bulan" %}
  <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
{%- elif nama == "logo" %}
  <rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/>
  <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>
{%- elif nama == "jendela" %}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M6.5 6.5h.01M9 6.5h.01M11.5 6.5h.01"/>
{%- elif nama == "pengaturan" %}
  <circle cx="12" cy="12" r="3"/>

{%- elif nama == "monitor" %}
  <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
{%- elif nama == "folder" %}
  <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
{%- elif nama == "salin" %}
  <rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>
{%- elif nama == "riwayat" %}
  <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 8v4l3 2"/>
{%- elif nama == "silang" %}
  <path d="M6 6l12 12M18 6L6 18"/>
{%- elif nama == "unggah" %}
  <path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
{%- elif nama == "unduh" %}
  <path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
{%- elif nama == "hapus" %}
  <path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/>
{%- elif nama == "pengguna" %}
  <circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/>
{%- elif nama == "keluar" %}
  <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/>
{%- elif nama == "info" %}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
{%- elif nama == "peringatan" %}
  <path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>
{%- else %}
  <circle cx="12" cy="12" r="8"/>
{%- endif %}
</svg>
{%- endmacro %}
