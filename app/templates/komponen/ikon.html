{#- Kumpulan ikon SVG inline. Pemakaian: {{ ikon("kamera") }}
    Warna mengikuti teks (currentColor), jadi otomatis cocok dengan tema. -#}
{% macro ikon(nama, kelas="ikon") -%}
<svg class="{{ kelas }}" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if nama == "dokumen-pecah" %}
  <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>
  <path d="M8 13h8" stroke-dasharray="2 2"/><path d="M9 17h6"/><path d="M9 9.5h2"/>
{%- elif nama == "kamera" %}
  <path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
  <circle cx="12" cy="13" r="3.5"/>
{%- elif nama == "plus" %}
  <path d="M12 5v14M5 12h14"/>
{%- elif nama == "panah-kiri" %}
  <path d="M19 12H5M11 18l-6-6 6-6"/>
{%- elif nama == "panah-kanan" %}
  <path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif nama == "centang" %}
  <path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif nama == "matahari" %}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif nama == "bulan" %}
  <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
{%- elif nama == "logo" %}
  <rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/>
  <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>
{%- else %}
  <circle cx="12" cy="12" r="8"/>
{%- endif %}
</svg>
{%- endmacro %}
